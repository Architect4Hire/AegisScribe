  <!-- The only sanctioned Wowhead integration: their own script decorates our outbound item-cell
       anchors with a tooltip on hover. The server never calls Wowhead -- see
       .claude/rules/external.md and .claude/rules/frontend.md. renameLinks:false is load-bearing:
       the script would otherwise overwrite our rendered item names with Wowhead's own, which
       quietly breaks anything matching on that text (e.g. item-cell's render tests). -->
  <script>const whTooltips = { colorLinks: true, iconizeLinks: true, renameLinks: false };</script>
  <script src="https://wow.zamimg.com/js/tooltips.js"></script>
</body>
